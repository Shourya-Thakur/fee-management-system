<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - Fee Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center h-screen">

  <div class="bg-white p-8 rounded-2xl shadow-lg w-96">
    <h2 class="text-2xl font-bold text-center mb-6">Login</h2>

<form id="loginForm">
  
  <!-- Role Selection -->
  <label class="block mb-2 font-semibold">Select Role</label>
  <select id="role" class="w-full p-2 border rounded mb-4">
    <option value="student">Student</option>
    <option value="accountant">Accountant</option>
    <option value="admin">Admin</option>
  </select>

  <!-- Email -->
  <label class="block mb-2 font-semibold">Email</label>
  <input type="email" id="email" class="w-full p-2 border rounded mb-4" required>

  <!-- Password -->
  <label class="block mb-2 font-semibold">Password</label>
  <input type="password" id="password" class="w-full p-2 border rounded mb-4" required>

  <!-- Button -->
  <button type="submit" class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700">
    Login
  </button>
</form>

  </div>

  <script src="js/main.js"></script>

</body>
</html>
